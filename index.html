<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>GlucoSync｜AI 控糖降脂健康儀表板</title>

  <!-- External dependencies: classic global scripts (no ES modules => works over file://) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

  <style>
    html, body { -webkit-tap-highlight-color: transparent; }
    [v-cloak] { display: none; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="app" v-cloak></div>

  <script>
  (function () {
    'use strict';

    var Vue_ = window.Vue;
    var createApp = Vue_.createApp, ref = Vue_.ref, reactive = Vue_.reactive, computed = Vue_.computed;
    var watch = Vue_.watch, onMounted = Vue_.onMounted, onBeforeUnmount = Vue_.onBeforeUnmount;
    var provide = Vue_.provide, inject = Vue_.inject;

    /* =====================================================================
     * 1. DATA  (from src/data/presets.js)
     * ===================================================================== */
    var TARGETS = {
      userWeight: 70,
      hydrationMin: 2100, hydrationMax: 2660,
      exerciseTarget: 20,
      satFatMin: 15, satFatMax: 20,
      carbsMin: 100, carbsMax: 180
    };

    var PRESETS = [
      { id: 'weekday-breakfast', category: '平日', label: '平日早餐', description: '7-11 無糖豆漿 + 無糖優格 + 沙拉(醬汁減半) + 茶葉蛋/溫泉蛋' },
      { id: 'weekday-lunch', category: '平日', label: '平日午餐', description: '7-11 健康餐盒：2/3 份紫米/多穀飯 + 烤雞/鯖魚/牛肉/雞胸肉 + 關東煮蔬菜' },
      { id: 'miss-energy', category: '外食', label: '能量小姐', description: '能量小姐 (Miss Energy) 健康餐盒，主食減量，蔬菜與蛋白質優先' },
      { id: 'liang-she-han', category: '外食', label: '梁社漢/蔡家排骨', description: '梁社漢/蔡家排骨：滷雞腿/油雞/滷豬排擇一，飯吃一半，搭配蔬菜' },
      { id: 'chicken-homestead', category: '外食', label: '雞肉本家', description: '雞肉本家：醬汁清淡、飯吃一半、燙青菜 + 豆腐' },
      { id: 'popiah', category: '外食', label: '素食潤餅', description: '素食潤餅：不加花生糖粉、不加酥脆餅皮屑 + 無糖豆漿 + 蛋' },
      { id: 'stir-fried-pasta', category: '外食', label: '炒義大利麵', description: '炒義大利麵 (麵量減少)' },
      { id: 'braised-dishes', category: '外食', label: '滷味 (熱/冷)', description: '熱滷/冷滷味：原型蔬菜、瘦肉、豆製品/豆腐，不加酸菜、不加麻油' },
      { id: 'mini-hotpot', category: '外食', label: '小火鍋', description: '小火鍋 (12MINI / 麗媽涮涮鍋)：原味湯底，雞胸肉/海鮮，不喝湯' },
      { id: 'home-steamer', category: '在家', label: '電蒸鍋餐', description: '家用電蒸鍋餐：雞腿肉/蝦 + 小白菜/花椰菜/竹筍 + 嫩豆腐 + 番茄 + 蛋；調味為 10-15ml 無添加醬油、1 茶匙蒜泥、七味粉、五香粉、鹽' },
      { id: 'weekend-brunch', category: '假日', label: '假日早午餐', description: '麥味登嫩雞沙拉 + 無糖綠茶 + 蛋；或傳統早餐店蔬菜蛋餅(里肌/雙蛋) + 沙拉' }
    ];

    var TAGS = ['[飯吃 1/2]', '[飯吃 2/3]', '[醬汁減半]', '[不喝湯]', '[去皮]', '[先菜肉後飯]', '[餐後踏步 20分]'];

    var EXERCISE_TYPES = ['餐後踏步', '抬腳跟', '戶外散步', '慢跑/路跑', '健身房跑步機', '重訓/肌力', '騎車'];

    var DRINK_PRESETS = [
      { id: 'drk-green-tea', name: '無糖綠茶/烏龍茶', default_cc: 500, counts_as_water: true },
      { id: 'drk-black-coffee', name: '美式黑咖啡', default_cc: 350, counts_as_water: true },
      { id: 'drk-sparkling', name: '無糖氣泡水', default_cc: 500, counts_as_water: true },
      { id: 'drk-soy-milk', name: '無糖豆漿', default_cc: 400, counts_as_water: false },
      { id: 'drk-almond-milk', name: '無糖杏仁飲', default_cc: 300, counts_as_water: false }
    ];

    var MEDICATIONS = [
      { id: 'eutomin', name: '[REDACTED] ([REDACTED])', dosage: '850mg', timing: 'both' },
      { id: 'forxiga', name: '[REDACTED] ([REDACTED])', dosage: '10mg', timing: 'morning' },
      { id: 'glitos', name: '[REDACTED] ([REDACTED])', dosage: '15mg', timing: 'morning' },
      { id: 'roty', name: '[REDACTED] ([REDACTED])', dosage: '20mg', timing: 'morning' }
    ];

    var BASELINE_DATE = '2026-09-05';
    var LAB_FIELDS = [
      { key: 'hba1c', label: 'HbA1c', unit: '%', baseline: null, target: 7.5, targetLabel: '< 7.0-7.5', dir: 'lt' },
      { key: 'ac_sugar', label: 'AC Sugar', unit: 'mg/dL', baseline: null, target: 130, targetLabel: '< 110-130', dir: 'lt' },
      { key: 'ldl', label: 'LDL-C', unit: 'mg/dL', baseline: null, target: 100, targetLabel: '< 100', dir: 'lt' },
      { key: 'tg', label: 'TG', unit: 'mg/dL', baseline: null, target: 150, targetLabel: '< 150', dir: 'lt' },
      { key: 't_cho', label: 'T-Cho', unit: 'mg/dL', baseline: null, target: null, targetLabel: '—', dir: null },
      { key: 'hdl', label: 'HDL-C', unit: 'mg/dL', baseline: null, target: null, targetLabel: '—', dir: null },
      { key: 'uacr', label: 'UAcr', unit: '', baseline: null, target: 30, targetLabel: '< 30', dir: 'lt' },
      { key: 'micro_albumin', label: 'Micro-Albumin', unit: 'mg/L', baseline: null, target: null, targetLabel: '—', dir: null },
      { key: 'creatinine', label: 'Creatinine', unit: 'mg/dL', baseline: null, target: null, targetLabel: '—', dir: null },
      { key: 'egfr', label: 'eGFR', unit: '', baseline: null, target: null, targetLabel: '—', dir: null },
      { key: 'bun', label: 'BUN', unit: 'mg/dL', baseline: null, target: null, targetLabel: '—', dir: null },
      { key: 'uric_acid', label: 'Uric Acid', unit: 'mg/dL', baseline: null, target: null, targetLabel: '—', dir: null },
      { key: 's_gpt', label: 'S-GPT', unit: 'U/L', baseline: null, target: null, targetLabel: '—', dir: null },
      { key: 'u_sg', label: 'U-Specific Gravity', unit: '', baseline: null, target: null, targetLabel: '1.005-1.030', dir: null }
    ];
    var URINE_QUALITATIVE = [
      { key: 'u_sugar', label: 'U-Sugar', baseline: '++++' },
      { key: 'u_ketones', label: 'U-Ketones', baseline: '+++' }
    ];

    /* ---------------------------------------------------------------------
     * User customization (glucosync.customConfig)
     * ------------------------------------------------------------------- */
    var SECTIONS = ['presets', 'tags', 'exerciseTypes', 'drinkPresets', 'medications', 'targets'];
    var TIMINGS = ['morning', 'evening', 'both'];
    function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }

    var customConfig = reactive({});
    var live = reactive({
      presets: deepCopy(PRESETS),
      tags: deepCopy(TAGS),
      exerciseTypes: deepCopy(EXERCISE_TYPES),
      drinkPresets: deepCopy(DRINK_PRESETS),
      medications: deepCopy(MEDICATIONS),
      targets: Object.assign({}, TARGETS)
    });
    var changeListener = null;
    function onCustomConfigChange(fn) { changeListener = fn; }

    function hydrationRangeFromWeight(weightKg) {
      var w = Number(weightKg);
      var weight = isFinite(w) && w > 0 ? w : 70;
      var hydrationMin = Math.max(2000, Math.round(weight * 30));
      var hydrationMax = Math.max(hydrationMin + 400, Math.round(weight * 38));
      return { userWeight: weight, hydrationMin: hydrationMin, hydrationMax: hydrationMax };
    }

    function recompute() {
      live.presets = deepCopy(customConfig.presets != null ? customConfig.presets : PRESETS);
      live.tags = deepCopy(customConfig.tags != null ? customConfig.tags : TAGS);
      live.exerciseTypes = deepCopy(customConfig.exerciseTypes != null ? customConfig.exerciseTypes : EXERCISE_TYPES);
      live.drinkPresets = deepCopy(customConfig.drinkPresets != null ? customConfig.drinkPresets : DRINK_PRESETS);
      live.medications = deepCopy(customConfig.medications != null ? customConfig.medications : MEDICATIONS);
      var merged = Object.assign({}, TARGETS, customConfig.targets || {});
      live.targets = Object.assign({}, merged, hydrationRangeFromWeight(merged.userWeight));
    }

    function sanitizeCustomConfig(cfg) {
      var out = {};
      if (!cfg || typeof cfg !== 'object') return out;
      if (Array.isArray(cfg.presets)) {
        out.presets = cfg.presets
          .filter(function (p) { return p && typeof p.label === 'string' && p.label.trim(); })
          .map(function (p, i) {
            return {
              id: String(p.id || ('custom-' + Date.now() + '-' + i)),
              category: String(p.category || '自訂').trim() || '自訂',
              label: p.label.trim(),
              description: String(p.description || '')
            };
          });
      }
      if (Array.isArray(cfg.tags)) {
        var seen = {};
        out.tags = cfg.tags
          .filter(function (t) { return typeof t === 'string' && t.trim(); })
          .map(function (t) { return t.trim(); })
          .filter(function (t) { if (seen[t]) return false; seen[t] = true; return true; });
      }
      if (Array.isArray(cfg.exerciseTypes)) {
        var seenEx = {};
        out.exerciseTypes = cfg.exerciseTypes
          .filter(function (t) { return typeof t === 'string' && t.trim(); })
          .map(function (t) { return t.trim(); })
          .filter(function (t) { if (seenEx[t]) return false; seenEx[t] = true; return true; });
      }
      if (Array.isArray(cfg.drinkPresets)) {
        out.drinkPresets = cfg.drinkPresets
          .filter(function (d) { return d && typeof d.name === 'string' && d.name.trim(); })
          .map(function (d, i) {
            return {
              id: String(d.id || ('drk-' + Date.now() + '-' + i)),
              name: d.name.trim(),
              default_cc: Math.max(0, Number(d.default_cc) || 0),
              counts_as_water: Boolean(d.counts_as_water)
            };
          });
      }
      if (Array.isArray(cfg.medications)) {
        out.medications = cfg.medications
          .filter(function (m) { return m && typeof m.name === 'string' && m.name.trim(); })
          .map(function (m, i) {
            return {
              id: String(m.id || ('med-' + Date.now() + '-' + i)),
              name: m.name.trim(),
              dosage: String(m.dosage || '').trim(),
              timing: TIMINGS.indexOf(m.timing) >= 0 ? m.timing : 'morning'
            };
          });
      }
      if (cfg.targets && typeof cfg.targets === 'object') {
        var t = {}, n = 0;
        Object.keys(TARGETS).forEach(function (k) {
          var raw = cfg.targets[k], v = Number(raw);
          if (raw !== '' && raw != null && isFinite(v) && v >= 0) { t[k] = v; n++; }
        });
        if (n) out.targets = t;
      }
      return out;
    }

    function applyCustomConfig(cfg) {
      Object.keys(customConfig).forEach(function (k) { delete customConfig[k]; });
      Object.assign(customConfig, sanitizeCustomConfig(cfg));
      recompute();
    }
    function getCustomConfig() { return deepCopy(customConfig); }

    function updateCustom(section, value) {
      if (SECTIONS.indexOf(section) < 0) return;
      var obj = {}; obj[section] = value;
      var clean = sanitizeCustomConfig(obj)[section];
      if (clean === undefined) return;
      customConfig[section] = clean;
      recompute();
      if (changeListener) changeListener();
    }
    function resetCustom(sections) {
      [].concat(sections || SECTIONS).forEach(function (s) { delete customConfig[s]; });
      recompute();
      if (changeListener) changeListener();
    }

    function medsForSlot(slot) {
      return live.medications.filter(function (m) { return m.timing === 'both' || m.timing === slot; });
    }
    function medLabel(m) { return m.dosage ? m.name + ' ' + m.dosage : m.name; }

    /* =====================================================================
     * 2. STORAGE  (from src/firebase.js)
     * ===================================================================== */
    var SETTINGS_KEY = 'glucosync.settings';
    var DAYS_KEY = 'glucosync.days';
    var LABS_KEY = 'glucosync.labs';
    var CONFIG_KEY = 'glucosync.customConfig';
    var USED_NONCES_KEY = 'glucosync.usedNonces';
    var PENDING_QR_PAIR_KEY = 'glucosync.pendingQrPair';
    var QR_PAIR_TTL_MS = 5 * 60 * 1000;

    function readJSON(key, fallback) {
      try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
      catch (e) { return fallback; }
    }
    function writeJSON(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

    function loadSettings() { return readJSON(SETTINGS_KEY, {}); }
    function saveSettings(s) { writeJSON(SETTINGS_KEY, s); }
    function getGeminiKey() { return loadSettings().geminiApiKey || ''; }
    var DEFAULT_GEMINI_MODEL = 'gemini-3.8-flash';
    var GEMINI_MODEL_OPTIONS = ['gemini-3.8-flash'];
    var DEFAULT_THINKING_BUDGET = 0;
    var THINKING_LEVEL_OPTIONS = [
      { label: '極速 / 關閉', budget: 0, hint: '建議用於即時餐點紀錄，約 1–2 秒' },
      { label: '低思考', budget: 1024, hint: '約 3–5 秒' },
      { label: '中思考', budget: 4096, hint: '約 6–10 秒' },
      { label: '高思考', budget: 8192, hint: '詳細檢驗解讀' }
    ];
    function getGeminiModel() { return (loadSettings().geminiModel || '').trim() || DEFAULT_GEMINI_MODEL; }
    function normalizeThinkingBudget(value) {
      var n = parseInt(value != null && value !== '' ? value : DEFAULT_THINKING_BUDGET, 10);
      return isFinite(n) && n >= 0 ? n : DEFAULT_THINKING_BUDGET;
    }
    function getThinkingBudget() { return normalizeThinkingBudget(loadSettings().thinkingBudget); }

    function parseFirebaseConfig(text) {
      if (!text || !String(text).trim()) return null;
      var src = String(text).trim();
      var m = src.match(/\{[\s\S]*\}/);
      if (m) src = m[0];
      try { return JSON.parse(src); }
      catch (e) {
        try {
          var fixed = src
            .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')
            .replace(/'/g, '"')
            .replace(/,\s*}/g, '}');
          return JSON.parse(fixed);
        } catch (e2) { return null; }
      }
    }

    var ALLOWED_EMAIL = 'daniel.chang.hy@gmail.com';
    var ACCESS_DENIED_MESSAGE = '⛔ 存取被拒：此帳號未獲授權';
    function normalizeEmail(email) { return String(email || '').trim().toLowerCase(); }
    function isAuthorizedEmail(email) { return normalizeEmail(email) === ALLOWED_EMAIL; }

    var db = null;
    var auth = null;
    try {
      var fbCfg = parseFirebaseConfig(loadSettings().firebaseConfig);
      if (fbCfg && fbCfg.projectId && window.firebase) {
        var fbApp = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(fbCfg);
        db = fbApp.firestore();
        if (firebase.auth) auth = fbApp.auth();
      }
    } catch (err) {
      console.warn('[GlucoSync] Firebase init failed, using localStorage.', err);
      db = null;
      auth = null;
    }
    var BACKEND = db ? 'firestore' : 'localStorage';

    function isFirebaseConfigured() { return !!(db && auth); }
    function isCloudReady() {
      return !!(db && auth && auth.currentUser && isAuthorizedEmail(auth.currentUser.email));
    }
    function formatAuthError(err) {
      var code = err && err.code;
      var message = (err && err.message) || String(err);
      if (message && message.indexOf('存取被拒') >= 0) return ACCESS_DENIED_MESSAGE;
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return '已取消 Google 登入。';
      if (code === 'auth/popup-blocked') return '瀏覽器封鎖了登入視窗，請允許彈出視窗後再試。';
      if (code === 'auth/network-request-failed') return '網路連線失敗，請檢查網路後再試。';
      if (code === 'auth/unauthorized-domain') return '此網域尚未加入 Firebase 授權網域，請至 Firebase Console 設定。';
      return message;
    }
    async function signInWithGoogle() {
      if (!auth) throw new Error('尚未設定 Firebase，請先貼上 Firebase 設定後再登入。');
      var result = await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      var user = result.user;
      if (!isAuthorizedEmail(user && user.email)) {
        await auth.signOut();
        throw new Error(ACCESS_DENIED_MESSAGE);
      }
      return user;
    }
    async function signOutUser() {
      if (!auth) return;
      await auth.signOut();
    }
    function onAuthStateChanged(callback) {
      if (!auth) { callback(null, { ready: true, denied: false }); return function () {}; }
      return auth.onAuthStateChanged(function (user) {
        if (user && !isAuthorizedEmail(user.email)) {
          auth.signOut().then(function () { callback(null, { ready: true, denied: true }); }).catch(function () { callback(null, { ready: true, denied: true }); });
          return;
        }
        callback(user || null, { ready: true, denied: false });
      });
    }

    function bytesToBase64(bytes) {
      var bin = '', arr = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes), i;
      for (i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
      return btoa(bin);
    }
    function base64ToBytes(b64) {
      var bin = atob(String(b64 || '')), out = new Uint8Array(bin.length), i;
      for (i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function randomHex(byteLen) {
      var buf = new Uint8Array(byteLen || 16);
      crypto.getRandomValues(buf);
      return Array.prototype.map.call(buf, function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    }
    function randomBytes(byteLen) {
      var buf = new Uint8Array(byteLen || 16);
      crypto.getRandomValues(buf);
      return buf;
    }
    async function encryptJson(obj, keyBytes) {
      var iv = crypto.getRandomValues(new Uint8Array(12));
      var key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['encrypt']);
      var ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
      return { ciphertext: bytesToBase64(new Uint8Array(ct)), iv: bytesToBase64(iv) };
    }
    async function decryptJson(ciphertext, iv, keyBytes) {
      var key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
      var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: base64ToBytes(iv) }, key, base64ToBytes(ciphertext));
      return JSON.parse(new TextDecoder().decode(pt));
    }
    function pairingDocId(token) { return 'qr_pairing_' + token; }
    function pairingRef(token) { return db ? db.collection('config').doc(pairingDocId(token)) : null; }
    function getStoredFirebaseConfig() { return parseFirebaseConfig(loadSettings().firebaseConfig); }
    function applyPairedSettings(opts) {
      opts = opts || {};
      var prev = loadSettings();
      var fbText = prev.firebaseConfig || '';
      if (opts.firebaseConfig != null) fbText = typeof opts.firebaseConfig === 'string' ? opts.firebaseConfig : JSON.stringify(opts.firebaseConfig);
      saveSettings(Object.assign({}, prev, {
        geminiApiKey: opts.geminiKey != null ? String(opts.geminiKey) : (prev.geminiApiKey || ''),
        geminiModel: String(opts.geminiModel || '').trim() || prev.geminiModel || '',
        thinkingBudget: opts.thinkingBudget != null ? opts.thinkingBudget : prev.thinkingBudget,
        firebaseConfig: fbText
      }));
    }
    function ensureFirebaseFromSettings() {
      if (db && auth) return true;
      try {
        var fbCfg = parseFirebaseConfig(loadSettings().firebaseConfig);
        if (fbCfg && fbCfg.projectId && window.firebase) {
          var fbApp = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(fbCfg);
          db = fbApp.firestore();
          if (firebase.auth) auth = fbApp.auth();
          BACKEND = db ? 'firestore' : 'localStorage';
          return !!(db && auth);
        }
      } catch (err) { console.warn('[GlucoSync] Late Firebase init failed.', err); }
      return false;
    }
    async function writeQrPairing(token, record) {
      if (!isCloudReady()) throw new Error('雲端配對需要已登入的 Firebase。');
      await pairingRef(token).set(record);
    }
    async function readQrPairing(token) {
      if (!db) throw new Error('尚未設定 Firebase。');
      var snap = await pairingRef(token).get();
      return snap.exists ? snap.data() : null;
    }
    async function deleteQrPairing(token) {
      if (!db || !token) return;
      try { await pairingRef(token).delete(); } catch (err) { console.warn('[GlucoSync] pairing delete failed.', err); }
    }
    function watchQrPairing(token, onChange) {
      if (!db || !token) return function () {};
      return pairingRef(token).onSnapshot(function (snap) { onChange(snap.exists ? snap.data() : null); });
    }
    function readNonceList() {
      try { var v = JSON.parse(localStorage.getItem(USED_NONCES_KEY)); return Array.isArray(v) ? v : []; }
      catch (e) { return []; }
    }
    function nonceWasUsed(n) { return readNonceList().indexOf(n) >= 0; }
    function markNonceUsed(n) {
      var arr = readNonceList();
      arr.push(n);
      writeJSON(USED_NONCES_KEY, arr.slice(-80));
    }

    function todayKey(d) {
      d = d || new Date();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return d.getFullYear() + '-' + m + '-' + day;

    function emptyDay(date) {

    }
    function formatHttpError(status, detail) {
      var hint = HTTP_HINT[status] || 'Gemini API 呼叫失敗';

    async function fetchWithRetry(url, init) {
      var lastErr;
      var maxAttempts = 2;
      for (var attempt = 0; attempt < maxAttempts; attempt++) {
        var res;
        var controller = new AbortController();
        var timeoutId = setTimeout(function () { controller.abort(); }, 15000);
        var fetchInit = Object.assign({}, init, { signal: controller.signal });

        try {
          res = await fetch(url, fetchInit);
          clearTimeout(timeoutId);
        } catch (e) {
          clearTimeout(timeoutId);
          if (e.name === 'AbortError') {
            lastErr = new Error('[HTTP 504] 伺服器回應逾時 (超過 15 秒)，Google 運算負載過高，請稍後再試或點擊「只記錄」。');
          } else {
            lastErr = new Error('網路連線失敗，請檢查網路後再試。');
          }
          if (attempt < maxAttempts - 1) {
            await sleep(1500);
            continue;
          }
          throw lastErr;
        }

        if (res.ok) return res;

        var detail = await parseErrorBody(res);
        lastErr = new Error(formatHttpError(res.status, detail));

        if (res.status === 503) {
          if (attempt < maxAttempts - 1) {
            await sleep(1500);
            continue;
          }
          throw new Error('[HTTP 503] Google 伺服器目前繁忙，已自動為您保留輸入內容，請稍後再試或點擊「只記錄」。');
        }

        if (res.status === 429 && attempt < maxAttempts - 1) {
          await sleep(2000);
          continue;
        }

        throw lastErr;
      }
      throw lastErr;
    }

    async function generate(apiKey, parts, schema) {
      if (!apiKey) throw new Error('尚未設定 Gemini API Key，請至右上角設定。');
      var res = await fetchWithRetry(geminiEndpoint(getGeminiModel()), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
          contents: [{ role: 'user', parts: parts }],
          generationConfig: {
            temperature: 0.2,
            responseMimeType: 'application/json',
            responseSchema: schema,
            thinkingConfig: { thinkingBudget: getThinkingBudget() }
          }
        })
      });
      var data = await res.json();
      var cand = data && data.candidates && data.candidates[0];
      var text = cand && cand.content && cand.content.parts
        ? cand.content.parts.map(function (p) { return p.text || ''; }).join('') : '';
      if (!text) throw new Error('Gemini 未回傳內容 (可能被安全機制攔截)。');
      try { return JSON.parse(text); }
      catch (e) { throw new Error('無法解析 Gemini 回傳的 JSON。'); }
    }

    function averageIntake(summaries) {
      var list = Array.isArray(summaries) ? summaries : [];
      var n = list.length;
      function round(v) { return Math.round(v * 10) / 10; }
      if (!n) return { logged_days: 0, avg_carbs_g: 0, avg_saturated_fat_g: 0, avg_hydration_cc: 0, avg_exercise_min: 0 };
      var sum = list.reduce(function (acc, d) {
        acc.carbs += Number(d.carbs_g) || 0;
        acc.sat += Number(d.saturated_fat_g) || 0;
        acc.water += Number(d.hydration_cc) || 0;
        acc.ex += Number(d.exercise_min) || 0;
        return acc;
      }, { carbs: 0, sat: 0, water: 0, ex: 0 });
      return {
        logged_days: n,
        avg_carbs_g: round(sum.carbs / n),
        avg_saturated_fat_g: round(sum.sat / n),
        avg_hydration_cc: Math.round(sum.water / n),
        avg_exercise_min: round(sum.ex / n)
      };
    }

    function clampProposedTargets(raw, current) {
      current = current || {};
      if (!raw || typeof raw !== 'object') return null;
      var keys = ['carbsMin', 'carbsMax', 'satFatMin', 'satFatMax', 'hydrationMin', 'hydrationMax', 'exerciseTarget'];
      var hasAny = keys.some(function (k) { return raw[k] != null && raw[k] !== '' && isFinite(Number(raw[k])); });
      if (!hasAny) return null;
      function num(k, fallback) {
        var v = Number(raw[k]);
        if (isFinite(v)) return v;
        var c = Number(current[k]);
        return isFinite(c) ? c : fallback;
      }
      function round1(v) { return Math.round(v * 10) / 10; }
      var carbsMin = Math.min(180, Math.max(100, num('carbsMin', 100)));
      var carbsMax = Math.min(180, Math.max(100, num('carbsMax', 180)));
      if (carbsMin > carbsMax) carbsMin = carbsMax;
      var satFatMax = Math.min(20, Math.max(1, num('satFatMax', 20)));
      var satFatMin = Math.min(satFatMax, Math.max(0, num('satFatMin', 15)));
      var hydrationMin = Math.min(2500, Math.max(2000, num('hydrationMin', 2000)));
      var hydrationMax = Math.min(2500, Math.max(2000, num('hydrationMax', 2500)));
      if (hydrationMin > hydrationMax) hydrationMin = hydrationMax;
      var exerciseTarget = Math.max(20, num('exerciseTarget', 20));
      return {
        carbsMin: round1(carbsMin), carbsMax: round1(carbsMax),
        satFatMin: round1(satFatMin), satFatMax: round1(satFatMax),
        hydrationMin: Math.round(hydrationMin), hydrationMax: Math.round(hydrationMax),
        exerciseTarget: Math.round(exerciseTarget)
      };
    }

            <button type="button" class="shrink-0 rounded-xl bg-slate-100 px-3 py-2.5 text-sm text-slate-700 active:bg-slate-200 disabled:opacity-40" :disabled="!canGoNext" @click="nextDay">後一天 ▶</button>
          </div>
          <div v-if="isPastDate" class="mt-3 flex flex-wrap items-center justify-between gap-2 rounded-xl bg-amber-50 px-3 py-2 text-sm text-amber-800 ring-1 ring-amber-200">
            <p>⚠️ 正在補登 / 檢視：{{ selectedDate }}</p>
            <button type="button" class="rounded-lg bg-white px-3 py-1.5 text-xs font-medium text-amber-800 ring-1 ring-amber-200" @click="resetToToday">↩ 回到今天</button>
          </div>
        </section>
        <daily-tracker :day="currentDay" @update="updateDay" @open-settings="openSettings"></daily-tracker>
      </div>
      <trend-chart v-if="tab === 'trend'" :days="days"></trend-chart>
      <lab-milestones v-show="tab === 'labs'" :labs="labs" :days="days" @add-lab="addLab" @open-settings="openSettings" @apply-targets="applyProposedTargets"></lab-milestones>
    </template>
  </main>

  <nav class="fixed inset-x-0 bottom-0 z-20 grid grid-cols-3 border-t border-slate-200 bg-white pb-[env(safe-area-inset-bottom)] md:hidden">
    <button v-for="t in tabs" :key="t.id" class="flex flex-col items-center gap-0.5 py-2.5 text-xs"
      :class="tab === t.id ? 'font-semibold text-teal-700' : 'text-slate-500'" @click="tab = t.id">
      <span class="text-xl leading-none">{{ t.icon }}</span>{{ t.label }}
    </button>
  </nav>

  <!-- Settings modal -->
  <div v-if="isAuthorized && showSettings" class="fixed inset-0 z-30 flex items-end bg-black/40 sm:items-center sm:justify-center" @click.self="closeSettings">
    <div class="max-h-[90vh] w-full overflow-y-auto rounded-t-2xl bg-white p-5 sm:max-w-lg sm:rounded-2xl">
      <h2 class="text-lg font-semibold text-slate-800">設定</h2>
      <p class="mt-1 text-xs text-slate-500">金鑰僅儲存於此瀏覽器的 localStorage，不會寫入程式碼。</p>
      <div class="mt-4 grid grid-cols-2 gap-1 rounded-xl bg-slate-100 p-1">
        <button type="button" class="rounded-lg px-2 py-2 text-xs font-medium sm:text-sm"
          :class="settingsTab === 'system' ? 'bg-white text-teal-800 shadow-sm' : 'text-slate-500'" @click="settingsTab = 'system'">🔌 系統與 AI 設定</button>
        <button type="button" class="rounded-lg px-2 py-2 text-xs font-medium sm:text-sm"
          :class="settingsTab === 'targets' ? 'bg-white text-teal-800 shadow-sm' : 'text-slate-500'" @click="settingsTab = 'targets'">🎯 個人目標與用藥調整</button>
      </div>

      <div v-show="settingsTab === 'system'">
      <label class="mt-4 block text-sm font-medium text-slate-700">Gemini API Key
        <div class="mt-1 flex gap-2">
          <input v-model="settings.geminiApiKey" :type="showApiKey ? 'text' : 'password'" autocomplete="off" placeholder="AIza..." class="min-w-0 flex-1 rounded-lg border border-slate-300 p-2.5 text-base" />
          <button type="button" class="shrink-0 rounded-lg bg-slate-100 px-3 text-xs text-slate-600" @click="showApiKey = !showApiKey">{{ showApiKey ? '隱藏' : '顯示' }}</button>
        </div>
      </label>

      <label class="mt-4 block text-sm font-medium text-slate-700">Gemini 模型名稱 (Model ID)
        <input v-model="settings.geminiModel" type="text" autocomplete="off" spellcheck="false" placeholder="gemini-3.8-flash" class="mt-1 w-full rounded-lg border border-slate-300 p-2.5 font-mono text-sm" />
      </label>
      <div class="mt-2 flex flex-wrap gap-2">
        <button v-for="m in GEMINI_MODEL_OPTIONS" :key="m" type="button" class="rounded-full px-3 py-1.5 text-xs"
          :class="settings.geminiModel === m ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-700'"
          @click="settings.geminiModel = m">{{ m }}</button>
      </div>
      <p class="mt-1 text-xs text-slate-400">預設 {{ DEFAULT_GEMINI_MODEL }}。可在欄位填入其他有效模型名稱；舊版 gemini-2.0-flash / gemini-1.5-flash 已不適用新金鑰。</p>

      <p class="mt-4 text-sm font-medium text-slate-700">🧠 AI 思考程度 (Thinking Level)</p>
      <div class="mt-2 flex flex-wrap gap-2">
        <button v-for="opt in THINKING_LEVEL_OPTIONS" :key="opt.budget" type="button" class="rounded-full px-3 py-1.5 text-xs"
          :class="Number(settings.thinkingBudget) === opt.budget ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-700'"
          @click="settings.thinkingBudget = opt.budget">{{ opt.label }}</button>
      </div>
      <p class="mt-1 text-xs text-slate-400">{{ thinkingLevelHint() }}</p>

      <label class="mt-4 block text-sm font-medium text-slate-700">Firebase 設定 (JSON，可留空使用本機儲存)
        <textarea v-model="settings.firebaseConfig" rows="6" spellcheck="false"
          placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'
          class="mt-1 w-full rounded-lg border border-slate-300 p-2.5 font-mono text-xs"></textarea>
      </label>

      <div class="mt-5 rounded-xl bg-slate-50 p-3 ring-1 ring-slate-200">
        <p class="text-sm font-medium text-slate-800">📱 產生手機配對動態 QR Code</p>
        <p class="mt-1 text-xs text-slate-500">掃碼一次即匯入金鑰與設定，配對後 QR 立即銷毀。有效時間 5 分鐘。</p>
        <button type="button" class="mt-3 w-full rounded-lg bg-teal-700 py-2.5 text-sm font-semibold text-white disabled:opacity-60"
          :disabled="qrPair.busy" @click="generateQrPairing">{{ qrPair.active ? '重新產生 QR Code' : '📱 產生手機配對動態 QR Code' }}</button>
        <div v-if="qrPair.active" class="mt-3 text-center">
          <div class="mx-auto max-w-[220px] overflow-hidden rounded-xl bg-white p-2 ring-1 ring-slate-200" v-html="qrPair.svg"></div>
          <p class="mt-2 text-sm font-semibold text-slate-700">剩餘 {{ qrCountdownLabel }}</p>
          <p class="text-xs text-slate-400">{{ qrPair.mode === 'cloud' ? '雲端單次銷毀模式' : '離線時效 / 單次 nonce 模式' }}</p>
          <button type="button" class="mt-2 text-sm text-rose-600" @click="destroyQrPairing(false)">✕ 立即銷毀 QR Code</button>
        </div>
      </div>

      <hr class="my-5 border-slate-200" />
      <h3 class="text-sm font-semibold text-slate-800">資料備份 / 轉移 (電腦 ⇄ 手機)</h3>
      <p class="mt-1 text-xs text-slate-500">匯出每日記錄、檢驗結果與自訂快選/標籤/目標/用藥為 JSON 檔 (不含 API Key 與 Firebase 設定)；匯入時會與現有資料合併，同日期以匯入檔為準，自訂設定則整組還原。</p>
      <div class="mt-3 grid grid-cols-2 gap-3">
        <button class="rounded-xl bg-slate-100 py-3 text-slate-700 active:bg-slate-200" @click="exportData">⬇️ 匯出 JSON</button>
        <label class="cursor-pointer rounded-xl bg-slate-100 py-3 text-center text-slate-700 active:bg-slate-200">⬆️ 匯入 JSON
          <input type="file" accept="application/json,.json" class="hidden" @change="importData" />
        </label>
      </div>
      <p v-if="dataMsg" class="mt-2 text-sm" :class="dataMsgOk ? 'text-emerald-700' : 'text-rose-600'">{{ dataMsg }}</p>
      </div>

      <div v-show="settingsTab === 'targets'">
      <p class="mt-4 text-xs text-slate-500">回診後可直接在此調整每日目標與用藥，儲存後「今日記錄」與「趨勢」圖會立即套用。</p>
      <div class="mt-3 grid grid-cols-2 gap-3">
        <label v-for="f in TARGET_FIELDS" :key="f.key" class="text-xs text-slate-500">{{ f.label }}
          <input v-model="draft.targets[f.key]" type="number" min="0" step="any" inputmode="decimal" :readonly="f.readonly"
            class="mt-1 w-full rounded-lg border border-slate-300 p-2.5 text-base text-slate-800"
            :class="f.readonly ? 'bg-slate-50 text-slate-600' : ''" />
        </label>
      </div>
      <p class="mt-1 text-xs text-slate-400">預設：碳水 100-180g、飽和脂肪 15-20g、飲水依體重（70 kg → 2100-2660cc，下限不低於 2000cc）、運動 20 分。</p>
      <p class="mt-4 text-sm font-medium text-slate-700">用藥清單</p>
      <div class="mt-2 space-y-2">
        <div v-for="(m, i) in draft.medications" :key="m.id" class="space-y-1.5 rounded-lg bg-slate-50 p-2.5 ring-1 ring-slate-200">
          <div class="flex gap-2">
            <input v-model="m.name" placeholder="藥名 (例如 [REDACTED] ([REDACTED]))" class="min-w-0 flex-1 rounded-lg border border-slate-300 bg-white p-2 text-base" />
            <button class="grid size-10 shrink-0 place-items-center rounded-lg bg-rose-50 text-rose-600 active:bg-rose-100" aria-label="刪除藥物" @click="removeDraftMed(i)">🗑</button>
          </div>
          <div class="flex gap-2">
            <input v-model="m.dosage" placeholder="劑量 (例如 850mg)" class="min-w-0 flex-1 rounded-lg border border-slate-300 bg-white p-2 text-base" />
            <select v-model="m.timing" class="rounded-lg border border-slate-300 bg-white p-2 text-base">
              <option value="morning">早上</option>
              <option value="evening">晚上</option>
              <option value="both">早 + 晚</option>
            </select>
          </div>
        </div>
      </div>
      <button class="mt-2 w-full rounded-lg bg-slate-100 py-2.5 text-sm text-slate-700 active:bg-slate-200" @click="addDraftMed">＋ 新增藥物</button>
      <button class="mt-2 w-full rounded-lg py-2 text-sm text-rose-600 active:bg-rose-50" @click="resetTargetsAndMeds">↩︎ 恢復預設目標與用藥</button>
      </div>

      <p v-if="settingsError" class="mt-3 rounded-lg bg-rose-50 p-2 text-sm text-rose-600">{{ settingsError }}</p>
      <div class="mt-5 grid grid-cols-2 gap-3">
        <button class="rounded-xl bg-slate-100 py-3 text-slate-700" @click="closeSettings">取消</button>
        <button class="rounded-xl bg-teal-700 py-3 font-semibold text-white" @click="submitSettings">儲存</button>
      </div>
    </div>
  </div>
  </div>
</div>`
    };

    createApp(App).mount('#app');
  })();
  </script>
</body>
</html>
