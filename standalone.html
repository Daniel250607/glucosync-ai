<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>GlucoSync｜AI 控糖降脂健康儀表板</title>

  <!-- External dependencies: classic global scripts (no ES modules => works over file://) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <style>
    html, body { -webkit-tap-highlight-color: transparent; }
    [v-cloak] { display: none; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="app" v-cloak></div>

  <script>
  (function () {
    'use strict';

    var Vue_ = window.Vue;
    var createApp = Vue_.createApp, ref = Vue_.ref, reactive = Vue_.reactive, computed = Vue_.computed;
    var watch = Vue_.watch, onMounted = Vue_.onMounted, onBeforeUnmount = Vue_.onBeforeUnmount;
    var provide = Vue_.provide, inject = Vue_.inject;

    /* =====================================================================
     * 1. DATA  (from src/data/presets.js)
     * ===================================================================== */
    var TARGETS = {
      hydrationMin: 2000, hydrationMax: 2500,
      // Post-dinner marching-in-place target duration (min).
      exerciseTarget: 20,
      // Saturated fat warning / strict limit (g/day).
      satFatMin: 15, satFatMax: 20,
      // Carb safety bounds (g/day): lower bound avoids ketogenic-like intake on an SGLT-2i (Forxiga).
      carbsMin: 100, carbsMax: 180
    };

    // Defaults. User customizations (glucosync.customConfig) override these via the `live` store below.
    var PRESETS = [
      { id: 'weekday-breakfast', category: '平日', label: '平日早餐', description: '7-11 無糖豆漿 + 無糖優格 + 沙拉(醬汁減半) + 茶葉蛋/溫泉蛋' },
      { id: 'weekday-lunch', category: '平日', label: '平日午餐', description: '7-11 健康餐盒：2/3 份紫米/多穀飯 + 烤雞/鯖魚/牛肉/雞胸肉 + 關東煮蔬菜' },
      { id: 'miss-energy', category: '外食', label: '能量小姐', description: '能量小姐 (Miss Energy) 健康餐盒，主食減量，蔬菜與蛋白質優先' },
      { id: 'liang-she-han', category: '外食', label: '梁社漢/蔡家排骨', description: '梁社漢/蔡家排骨：滷雞腿/油雞/滷豬排擇一，飯吃一半，搭配蔬菜' },
      { id: 'chicken-homestead', category: '外食', label: '雞肉本家', description: '雞肉本家：醬汁清淡、飯吃一半、燙青菜 + 豆腐' },
      { id: 'popiah', category: '外食', label: '素食潤餅', description: '素食潤餅：不加花生糖粉、不加酥脆餅皮屑 + 無糖豆漿 + 蛋' },
      { id: 'stir-fried-pasta', category: '外食', label: '炒義大利麵', description: '炒義大利麵 (麵量減少)' },
      { id: 'braised-dishes', category: '外食', label: '滷味 (熱/冷)', description: '熱滷/冷滷味：原型蔬菜、瘦肉、豆製品/豆腐，不加酸菜、不加麻油' },
      { id: 'mini-hotpot', category: '外食', label: '小火鍋', description: '小火鍋 (12MINI / 麗媽涮涮鍋)：原味湯底，雞胸肉/海鮮，不喝湯' },
      { id: 'home-steamer', category: '在家', label: '電蒸鍋餐', description: '家用電蒸鍋餐：雞腿肉/蝦 + 小白菜/花椰菜/竹筍 + 嫩豆腐 + 番茄 + 蛋；調味為 10-15ml 無添加醬油、1 茶匙蒜泥、七味粉、五香粉、鹽' },
      { id: 'weekend-brunch', category: '假日', label: '假日早午餐', description: '麥味登嫩雞沙拉 + 無糖綠茶 + 蛋；或傳統早餐店蔬菜蛋餅(里肌/雙蛋) + 沙拉' }
    ];

    var TAGS = ['[飯吃 1/2]', '[飯吃 2/3]', '[醬汁減半]', '[不喝湯]', '[去皮]', '[先菜肉後飯]', '[餐後踏步 20分]'];

    // timing: 'morning' | 'evening' | 'both'. `id` is the key used in day.meds[slot][id]
    // (same as the original keys, so existing logged data stays valid).
    var MEDICATIONS = [
      { id: 'eutomin', name: 'Eutomin (Metformin)', dosage: '850mg', timing: 'both' },
      { id: 'forxiga', name: 'Forxiga (Dapagliflozin)', dosage: '10mg', timing: 'morning' },
      { id: 'glitos', name: 'Glitos (Pioglitazone)', dosage: '15mg', timing: 'morning' },
      { id: 'roty', name: 'Roty (Rosuvastatin)', dosage: '20mg', timing: 'morning' }
    ];

    var BASELINE_DATE = '2026-09-05';
    // dir 'lt' = lower is better (value must be below target)
    var LAB_FIELDS = [
      { key: 'hba1c', label: 'HbA1c', unit: '%', baseline: 11.7, target: 7.5, targetLabel: '< 7.0-7.5', dir: 'lt' },
      { key: 'ac_sugar', label: 'AC Sugar', unit: 'mg/dL', baseline: 259, target: 130, targetLabel: '< 110-130', dir: 'lt' },
      { key: 'ldl', label: 'LDL-C', unit: 'mg/dL', baseline: 158, target: 100, targetLabel: '< 100', dir: 'lt' },
      { key: 'tg', label: 'TG', unit: 'mg/dL', baseline: 203, target: 150, targetLabel: '< 150', dir: 'lt' },
      { key: 't_cho', label: 'T-Cho', unit: 'mg/dL', baseline: 244, target: null, targetLabel: '—', dir: null },
      { key: 'hdl', label: 'HDL-C', unit: 'mg/dL', baseline: 57, target: null, targetLabel: '—', dir: null },
      { key: 'uacr', label: 'UAcr', unit: '', baseline: 32.46, target: 30, targetLabel: '< 30', dir: 'lt' },
      { key: 'micro_albumin', label: 'Micro-Albumin', unit: 'mg/L', baseline: 27.2, target: null, targetLabel: '—', dir: null },
      { key: 'creatinine', label: 'Creatinine', unit: 'mg/dL', baseline: 0.75, target: null, targetLabel: '—', dir: null },
      { key: 'egfr', label: 'eGFR', unit: '', baseline: 112.71, target: null, targetLabel: '—', dir: null },
      { key: 'bun', label: 'BUN', unit: 'mg/dL', baseline: 13.3, target: null, targetLabel: '—', dir: null },
      { key: 'uric_acid', label: 'Uric Acid', unit: 'mg/dL', baseline: 3.97, target: null, targetLabel: '—', dir: null },
      { key: 's_gpt', label: 'S-GPT', unit: 'U/L', baseline: 15, target: null, targetLabel: '—', dir: null },
      { key: 'u_sg', label: 'U-Specific Gravity', unit: '', baseline: 1.037, target: null, targetLabel: '1.005-1.030', dir: null }
    ];
    var URINE_QUALITATIVE = [
      { key: 'u_sugar', label: 'U-Sugar', baseline: '++++' },
      { key: 'u_ketones', label: 'U-Ketones', baseline: '+++' }
    ];

    /* ---------------------------------------------------------------------
     * User customization (glucosync.customConfig)
     * `customConfig` holds ONLY the sections the user changed; missing sections fall back to
     * the defaults above. `live` is the effective, reactive config all components read from.
     * ------------------------------------------------------------------- */
    var SECTIONS = ['presets', 'tags', 'medications', 'targets'];
    var TIMINGS = ['morning', 'evening', 'both'];
    function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }

    var customConfig = reactive({});
    var live = reactive({
      presets: deepCopy(PRESETS), tags: deepCopy(TAGS),
      medications: deepCopy(MEDICATIONS), targets: Object.assign({}, TARGETS)
    });
    var changeListener = null;
    function onCustomConfigChange(fn) { changeListener = fn; }

    function recompute() {
      live.presets = deepCopy(customConfig.presets != null ? customConfig.presets : PRESETS);
      live.tags = deepCopy(customConfig.tags != null ? customConfig.tags : TAGS);
      live.medications = deepCopy(customConfig.medications != null ? customConfig.medications : MEDICATIONS);
      live.targets = Object.assign({}, TARGETS, customConfig.targets || {});
    }

    // Validate untrusted config (storage / import); returns only valid sections.
    function sanitizeCustomConfig(cfg) {
      var out = {};
      if (!cfg || typeof cfg !== 'object') return out;
      if (Array.isArray(cfg.presets)) {
        out.presets = cfg.presets
          .filter(function (p) { return p && typeof p.label === 'string' && p.label.trim(); })
          .map(function (p, i) {
            return {
              id: String(p.id || ('custom-' + Date.now() + '-' + i)),
              category: String(p.category || '自訂').trim() || '自訂',
              label: p.label.trim(),
              description: String(p.description || '')
            };
          });
      }
      if (Array.isArray(cfg.tags)) {
        var seen = {};
        out.tags = cfg.tags
          .filter(function (t) { return typeof t === 'string' && t.trim(); })
          .map(function (t) { return t.trim(); })
          .filter(function (t) { if (seen[t]) return false; seen[t] = true; return true; });
      }
      if (Array.isArray(cfg.medications)) {
        out.medications = cfg.medications
          .filter(function (m) { return m && typeof m.name === 'string' && m.name.trim(); })
          .map(function (m, i) {
            return {
              id: String(m.id || ('med-' + Date.now() + '-' + i)),
              name: m.name.trim(),
              dosage: String(m.dosage || '').trim(),
              timing: TIMINGS.indexOf(m.timing) >= 0 ? m.timing : 'morning'
            };
          });
      }
      if (cfg.targets && typeof cfg.targets === 'object') {
        var t = {}, n = 0;
        Object.keys(TARGETS).forEach(function (k) {
          var raw = cfg.targets[k], v = Number(raw);
          if (raw !== '' && raw != null && isFinite(v) && v >= 0) { t[k] = v; n++; }
        });
        if (n) out.targets = t;
      }
      return out;
    }

    // Replace all overrides (load / import). Does not fire the change listener.
    function applyCustomConfig(cfg) {
      Object.keys(customConfig).forEach(function (k) { delete customConfig[k]; });
      Object.assign(customConfig, sanitizeCustomConfig(cfg));
      recompute();
    }
    function getCustomConfig() { return deepCopy(customConfig); }

    function updateCustom(section, value) {
      if (SECTIONS.indexOf(section) < 0) return;
      var obj = {}; obj[section] = value;
      var clean = sanitizeCustomConfig(obj)[section];
      if (clean === undefined) return;
      customConfig[section] = clean;
      recompute();
      if (changeListener) changeListener();
    }
    function resetCustom(sections) {
      [].concat(sections || SECTIONS).forEach(function (s) { delete customConfig[s]; });
      recompute();
      if (changeListener) changeListener();
    }

    function medsForSlot(slot) {
      return live.medications.filter(function (m) { return m.timing === 'both' || m.timing === slot; });
    }
    function medLabel(m) { return m.dosage ? m.name + ' ' + m.dosage : m.name; }

    /* =====================================================================
     * 2. STORAGE  (from src/firebase.js) — Firestore (compat SDK) with localStorage fallback
     *    No secrets are hardcoded: all config comes from user settings in localStorage.
     * ===================================================================== */
    var SETTINGS_KEY = 'glucosync.settings';
    var DAYS_KEY = 'glucosync.days';
    var LABS_KEY = 'glucosync.labs';
    var CONFIG_KEY = 'glucosync.customConfig';

    function readJSON(key, fallback) {
      try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
      catch (e) { return fallback; }
    }
    function writeJSON(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

    function loadSettings() { return readJSON(SETTINGS_KEY, {}); }
    function saveSettings(s) { writeJSON(SETTINGS_KEY, s); }
    function getGeminiKey() { return loadSettings().geminiApiKey || ''; }
    var DEFAULT_GEMINI_MODEL = 'gemini-3.8-flash';
    var GEMINI_MODEL_OPTIONS = ['gemini-3.8-flash'];
    var DEFAULT_THINKING_BUDGET = 0;
    var THINKING_LEVEL_OPTIONS = [
      { label: '極速 / 關閉', budget: 0, hint: '建議用於即時餐點紀錄，約 1–2 秒' },
      { label: '低思考', budget: 1024, hint: '約 3–5 秒' },
      { label: '中思考', budget: 4096, hint: '約 6–10 秒' },
      { label: '高思考', budget: 8192, hint: '詳細檢驗解讀' }
    ];
    function getGeminiModel() { return (loadSettings().geminiModel || '').trim() || DEFAULT_GEMINI_MODEL; }
    function normalizeThinkingBudget(value) {
      var n = parseInt(value != null && value !== '' ? value : DEFAULT_THINKING_BUDGET, 10);
      return isFinite(n) && n >= 0 ? n : DEFAULT_THINKING_BUDGET;
    }
    function getThinkingBudget() { return normalizeThinkingBudget(loadSettings().thinkingBudget); }

    // Accepts strict JSON or a pasted JS object literal ({ apiKey: "..." }).
    function parseFirebaseConfig(text) {
      if (!text || !String(text).trim()) return null;
      var src = String(text).trim();
      var m = src.match(/\{[\s\S]*\}/);
      if (m) src = m[0];
      try { return JSON.parse(src); }
      catch (e) {
        try {
          var fixed = src
            .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')
            .replace(/'/g, '"')
            .replace(/,\s*}/g, '}');
          return JSON.parse(fixed);
        } catch (e2) { return null; }
      }
    }

    var ALLOWED_EMAIL = 'daniel.chang.hy@gmail.com';
    var ACCESS_DENIED_MESSAGE = '⛔ 存取被拒：此帳號未獲授權';
    function normalizeEmail(email) { return String(email || '').trim().toLowerCase(); }
    function isAuthorizedEmail(email) { return normalizeEmail(email) === ALLOWED_EMAIL; }

    var db = null;
    var auth = null;
    try {
      var fbCfg = parseFirebaseConfig(loadSettings().firebaseConfig);
      if (fbCfg && fbCfg.projectId && window.firebase) {
        var fbApp = firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(fbCfg);
        db = fbApp.firestore();
        if (firebase.auth) auth = fbApp.auth();
      }
    } catch (err) {
      console.warn('[GlucoSync] Firebase init failed, using localStorage.', err);
      db = null;
      auth = null;
    }
    var BACKEND = db ? 'firestore' : 'localStorage';

    function isFirebaseConfigured() { return !!(db && auth); }
    function isCloudReady() {
      return !!(db && auth && auth.currentUser && isAuthorizedEmail(auth.currentUser.email));
    }
    function formatAuthError(err) {
      var code = err && err.code;
      var message = (err && err.message) || String(err);
      if (message && message.indexOf('存取被拒') >= 0) return ACCESS_DENIED_MESSAGE;
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return '已取消 Google 登入。';
      if (code === 'auth/popup-blocked') return '瀏覽器封鎖了登入視窗，請允許彈出視窗後再試。';
      if (code === 'auth/network-request-failed') return '網路連線失敗，請檢查網路後再試。';
      if (code === 'auth/unauthorized-domain') return '此網域尚未加入 Firebase 授權網域，請至 Firebase Console 設定。';
      return message;
    }
    async function signInWithGoogle() {
      if (!auth) throw new Error('尚未設定 Firebase，請先貼上 Firebase 設定後再登入。');
      var result = await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      var user = result.user;
      if (!isAuthorizedEmail(user && user.email)) {
        await auth.signOut();
        throw new Error(ACCESS_DENIED_MESSAGE);
      }
      return user;
    }
    async function signOutUser() {
      if (!auth) return;
      await auth.signOut();
    }
    function onAuthStateChanged(callback) {
      if (!auth) { callback(null, { ready: true, denied: false }); return function () {}; }
      return auth.onAuthStateChanged(function (user) {
        if (user && !isAuthorizedEmail(user.email)) {
          auth.signOut().then(function () { callback(null, { ready: true, denied: true }); }).catch(function () { callback(null, { ready: true, denied: true }); });
          return;
        }
        callback(user || null, { ready: true, denied: false });
      });
    }

    function todayKey(d) {
      d = d || new Date();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return d.getFullYear() + '-' + m + '-' + day;
    }

    function emptyDay(date) {
      return {
        date: date, hydration_cc: 0, exercise_min: 0,
        meds: {
          morning: { eutomin: false, forxiga: false, glitos: false, roty: false },
          evening: { eutomin: false }
        },
        meals: []
      };
    }

    async function loadDays() {
      var local = readJSON(DAYS_KEY, {});
      if (!isCloudReady()) return local;
      try {
        var snap = await db.collection('days').get();
        var remote = {};
        snap.forEach(function (d) { remote[d.id] = d.data(); });
        var merged = Object.assign({}, local, remote);
        writeJSON(DAYS_KEY, merged);
        return merged;
      } catch (err) {
        console.warn('[GlucoSync] Firestore read failed, using local cache.', err);
        return local;
      }
    }

    async function saveDay(day) {
      var all = readJSON(DAYS_KEY, {});
      all[day.date] = day;
      writeJSON(DAYS_KEY, all);
      if (!isCloudReady()) return;
      try { await db.collection('days').doc(day.date).set(day); }
      catch (err) { console.warn('[GlucoSync] Firestore write failed (kept in localStorage).', err); }
    }

    // Custom UI config (presets, tags, targets, medications): localStorage `glucosync.customConfig`,
    // mirrored to Firestore doc config/custom when configured. The newer `updated_at` wins.
    async function loadCustomConfig() {
      var local = readJSON(CONFIG_KEY, {});
      if (!isCloudReady()) return local;
      try {
        var snap = await db.collection('config').doc('custom').get();
        if (snap.exists) {
          var remote = snap.data();
          if ((remote.updated_at || 0) > (local.updated_at || 0)) { writeJSON(CONFIG_KEY, remote); return remote; }
        }
        if (local.updated_at) db.collection('config').doc('custom').set(local).catch(function () {});
      } catch (err) { console.warn('[GlucoSync] Firestore config read failed, using local copy.', err); }
      return local;
    }

    // `cfg` = overrides only. An empty object means "all defaults".
    async function saveCustomConfig(cfg) {
      var payload = Object.assign({}, JSON.parse(JSON.stringify(cfg || {})), { updated_at: Date.now() });
      writeJSON(CONFIG_KEY, payload);
      if (!isCloudReady()) return;
      try { await db.collection('config').doc('custom').set(payload); }
      catch (err) { console.warn('[GlucoSync] Firestore write failed (kept in localStorage).', err); }
    }

    async function loadLabs() {
      var local = readJSON(LABS_KEY, {});
      var merged = local;
      if (isCloudReady()) {
        try {
          var snap = await db.collection('labs').get();
          var remote = {};
          snap.forEach(function (d) { remote[d.id] = d.data(); });
          merged = Object.assign({}, local, remote);
          writeJSON(LABS_KEY, merged);
        } catch (err) { console.warn('[GlucoSync] Firestore read failed, using local cache.', err); }
      }
      return Object.keys(merged).map(function (k) { return merged[k]; })
        .sort(function (a, b) { return a.date.localeCompare(b.date); });
    }

    async function saveLab(lab) {
      var all = readJSON(LABS_KEY, {});
      all[lab.date] = lab;
      writeJSON(LABS_KEY, all);
      if (!isCloudReady()) return;
      try { await db.collection('labs').doc(lab.date).set(lab); }
      catch (err) { console.warn('[GlucoSync] Firestore write failed (kept in localStorage).', err); }
    }

    /* =====================================================================
     * 3. GEMINI SERVICE  (from src/services/gemini.js)
     * ===================================================================== */
    function geminiEndpoint(model) {
      return 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent';
    }

    var HEALTH_CONTEXT = [
      '# Health Context (Baseline) — Lab Date: 115/09/05 (2026-09-05)',
      '## Glycemic',
      '- AC Sugar: 259 mg/dL', '- HbA1c: 11.7 %',
      '## Lipids',
      '- TG: 203 mg/dL', '- T-Cho: 244 mg/dL', '- LDL-C: 158 mg/dL', '- HDL-C: 57 mg/dL',
      '## Renal & Urine',
      '- U-Sugar: ++++', '- U-Ketones: +++', '- U-Specific Gravity: 1.037', '- Micro-Albumin: 27.2 mg/L', '- UAcr: 32.46',
      '- Creatinine: 0.75 mg/dL', '- eGFR: 112.71', '- BUN: 13.3 mg/dL', '- Uric Acid: 3.97 mg/dL', '- S-GPT: 15 U/L',
      '## Medications',
      '- Eutomin (Metformin) 850 mg BID', '- Forxiga (Dapagliflozin) 10 mg QD (SGLT-2 inhibitor)',
      '- Glitos (Pioglitazone) 15 mg QD', '- Roty (Rosuvastatin) 20 mg QD',
      '## Daily Targets',
      '- Hydration: 2000-2500 cc', '- Post-dinner marching in place: 15-20 mins', '- Eating order: Veggies -> Protein -> Carbs (half portion)',
      '## 11-12 Month Follow-up Targets',
      '- HbA1c < 7.0-7.5 %', '- AC Sugar < 110-130 mg/dL', '- LDL-C < 100 mg/dL', '- TG < 150 mg/dL', '- UAcr < 30'
    ].join('\n');

    var SYSTEM_INSTRUCTION =
      'You are GlucoSync, a clinical-nutrition assistant for ONE patient with poorly controlled type 2 diabetes, dyslipidemia and early albuminuria. ' +
      'Respond in Traditional Chinese (繁體中文, Taiwan usage) inside all string fields. Be concise and practical (Taiwan convenience stores, bento shops, home cooking).\n\n' +
      '=== PATIENT BASELINE & MEDICATION CONTEXT ===\n' + HEALTH_CONTEXT + '\n\n' +
      '=== MANDATORY MEDICAL RULES ===\n' +
      '1. SGLT-2 inhibitor safety (Forxiga / dapagliflozin) + U-Ketones +++:\n' +
      '   - There is a risk of euglycemic diabetic ketoacidosis (euglycemic DKA).\n' +
      '   - NEVER recommend a zero-carb or ketogenic / very-low-carb diet, fasting, or skipping meals. Carbohydrate must stay moderate and distributed (roughly 100-180 g/day; about 30-60 g per main meal), using low-GI, high-fiber sources (purple rice, multigrain, vegetables, legumes).\n' +
      '   - If a meal has very low carbohydrate (< ~20 g for a main meal) or the user mentions fasting, vomiting, heavy alcohol or illness, set sglt2_ketone_safety_alert to "yellow" or "red" and advise adding a measured portion of complex carbohydrate and fluids (and to seek medical advice if ill).\n' +
      '2. LDL-C control (LDL-C 158, on Rosuvastatin): prioritize reducing SATURATED FAT (target < 15-20 g/day) and trans fat over limiting dietary cholesterol. Do not penalize eggs or seafood merely for cholesterol content; flag fatty cuts, skin, lard, cream, coconut/palm oil, fried and processed meat, and encourage unsaturated fats, fish, legumes, soluble fiber.\n' +
      '3. Glycemia / triglycerides (HbA1c 11.7%, TG 203): flag refined starch, sugary drinks, sauces with sugar, large rice/noodle portions, and fried foods. Encourage eating order: vegetables -> protein -> carbohydrate (half portion), and post-meal light activity (marching in place 15-20 min).\n' +
      '4. Renal / urine (UAcr 32.46, U-Specific Gravity 1.037, glycosuria): monitor sodium (aim < 2300 mg/day, ~< 800 mg/meal) and hydration (2000-2500 cc/day). Flag soups, pickles, processed food, heavy sauces. Do not recommend high-protein excess.\n' +
      '5. Never give a diagnosis or change medication doses. For medication questions advise consulting the treating physician.\n' +
      '6. Estimate nutrition honestly; when uncertain, give a reasonable estimate and say so in actionable_advice.\n' +
      '7. Keep actionable_advice to at most 60 words (about 2 short Traditional Chinese sentences). No long paragraphs.\n\n' +
      '=== TRAFFIC LIGHT SCHEME ===\n' +
      'Each alert has "level" in {green, yellow, red} and a short "message" (<= 40 Chinese characters):\n' +
      '- glycemic_tg_alert: carbohydrate load / refined starch / sugar / fried food effect on glucose and triglycerides.\n' +
      '- ldl_saturated_fat_alert: saturated fat load relative to the daily < 15-20 g budget.\n' +
      '- renal_hydration_alert: sodium load and hydration needs relevant to UAcr and urine specific gravity.\n' +
      '- sglt2_ketone_safety_alert: is carbohydrate adequate (not ketogenic) to avoid euglycemic DKA risk on Forxiga? Green means carbs are adequate; yellow/red means too low or risky situation.';

    var alertSchema = {
      type: 'OBJECT',

      },

    var labEvalSchema = {

        'saturated_fat_guidance', 'hydration_sodium_guidance', 'safety_flags']
    };

    var RETRY_WAITS_MS = [1500, 3000];
    var HTTP_HINT = {
      429: '請求過於頻繁，請稍後再試',
      500: 'Google 伺服器內部錯誤，請稍後再試',
      503: 'Google 伺服器負載過高，請稍後再試',
      401: 'API Key 無效或已過期，請至設定檢查',
      403: 'API Key 無權限或配額不足，請至設定檢查',
      404: '找不到此模型，請至設定更換模型名稱'
    };
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    async function parseErrorBody(res) {
      try { return ((await res.json()).error || {}).message || ''; }
      catch (e) {
        try { return (await res.text()).slice(0, 200); } catch (e2) { return ''; }
      }
    }
    function formatHttpError(status, detail) {
      var hint = HTTP_HINT[status] || 'Gemini API 呼叫失敗';
      return detail ? ('[HTTP ' + status + '] ' + hint + ' — ' + detail) : ('[HTTP ' + status + '] ' + hint);
    }
    async function fetchWithRetry(url, init) {
      var lastErr;
      for (var attempt = 0; attempt <= RETRY_WAITS_MS.length; attempt++) {
        var res;
        try { res = await fetch(url, init); }
        catch (e) {
          lastErr = new Error('網路連線失敗，請檢查網路後再試。');
          if (attempt < RETRY_WAITS_MS.length) { await sleep(RETRY_WAITS_MS[attempt]); continue; }
          throw lastErr;
        }
        if (res.ok) return res;
        lastErr = new Error(formatHttpError(res.status, await parseErrorBody(res)));
        if ((res.status === 503 || res.status === 429) && attempt < RETRY_WAITS_MS.length) {
          await sleep(RETRY_WAITS_MS[attempt]);
          continue;
        }
        throw lastErr;
      }
      throw lastErr;
    }

    async function generate(apiKey, parts, schema) {
      if (!apiKey) throw new Error('尚未設定 Gemini API Key，請至右上角設定。');
      var res = await fetchWithRetry(geminiEndpoint(getGeminiModel()), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
          contents: [{ role: 'user', parts: parts }],
          generationConfig: {
            temperature: 0.2,
            responseMimeType: 'application/json',
            responseSchema: schema,
            thinkingConfig: { thinkingBudget: getThinkingBudget() }
          }
        })
      });
      var data = await res.json();
      var cand = data && data.candidates && data.candidates[0];
      var text = cand && cand.content && cand.content.parts
        ? cand.content.parts.map(function (p) { return p.text || ''; }).join('') : '';
      if (!text) throw new Error('Gemini 未回傳內容 (可能被安全機制攔截)。');
      try { return JSON.parse(text); }
      catch (e) { throw new Error('無法解析 Gemini 回傳的 JSON。'); }
    }

    // Current daily targets and medication list as configured in the UI (may differ from the baseline).
    function userConfigLines() {
      var t = live.targets;
      var meds = live.medications.map(function (m) {
        return medLabel(m) + ' (' + (m.timing === 'both' ? 'morning+evening' : m.timing) + ')';
      }).join('; ');
      return [
        'User-configured daily targets: carbohydrate ' + t.carbsMin + '-' + t.carbsMax + ' g (never go ketogenic), saturated fat warning ' +
          t.satFatMin + ' g / limit ' + t.satFatMax + ' g, hydration ' + t.hydrationMin + '-' + t.hydrationMax +
          ' cc, post-dinner marching ' + t.exerciseTarget + ' min. Use these as the daily budgets.',
        'Current medication list configured by the user (treat as the current regimen): ' + (meds || 'none') + '.'
      ];
    }

    function analyzeMeal(opts) {
      var lines = ['Analyze this meal and return the structured JSON.'];
      if ((opts.text || '').trim()) lines.push('Meal description: ' + opts.text.trim());
      if (opts.tags && opts.tags.length) lines.push('Modifiers applied by the user: ' + opts.tags.join(' '));
      lines = lines.concat(userConfigLines());
      if (opts.dayContext) {
        lines.push('Intake so far today (before this meal): ' + JSON.stringify(opts.dayContext) +
          '. Use it to judge the daily saturated-fat, sodium and carbohydrate budgets and hydration.');
      }
      if (opts.image) lines.push('A photo of the meal is attached.');
      var parts = [{ text: lines.join('\n') }];
      if (opts.image) parts.push({ inlineData: { mimeType: opts.image.mimeType, data: opts.image.data } });
      return generate(opts.apiKey, parts, mealSchema);
    }

    function summarizeDayAI(opts) {
      var text = [
        'Write the end-of-day summary for this patient and return the structured JSON. The four alerts reflect the WHOLE day.',
        'Day totals and tracker values: ' + JSON.stringify(opts.totals),
        'Meals logged: ' + JSON.stringify(opts.meals),
        'Medications taken: ' + JSON.stringify(opts.meds),
        'Sodium budget: < 2300 mg/day.'
      ].concat(userConfigLines(), [
        'If some meals were logged without nutrition analysis, say the totals are incomplete.'
      ]).join('\n');
      return generate(opts.apiKey, [{ text: text }], daySummarySchema);
    }

    function evaluateLabs(opts) {
      var text = [
        'Evaluate the follow-up lab results against the 2026-09-05 baseline and the 11-12 month targets, then propose the next dynamic dietary phase.',
        'Logged follow-up labs (chronological): ' + JSON.stringify(opts.labs),
        'Recent daily intake summaries (last 14 logged days): ' + JSON.stringify(opts.recentDays)
      ].concat(userConfigLines(), [
        'Remember: never recommend ketogenic / zero-carb eating (Forxiga + U-Ketones +++); prioritize saturated fat over dietary cholesterol; keep hydration and sodium guidance.'
      ]).join('\n');
      return generate(opts.apiKey, [{ text: text }], labEvalSchema);
    }

    function summarizeDay(day) {
      var s = {
        date: day.date, kcal: 0, protein_g: 0, carbs_g: 0, fat_g: 0, saturated_fat_g: 0, fiber_g: 0, sodium_mg: 0,
        hydration_cc: day.hydration_cc || 0, exercise_min: day.exercise_min || 0
      };
      (day.meals || []).forEach(function (m) {
        var a = m.analysis;
        if (!a) return;
        var n = a.macronutrients || {};
        s.kcal += a.estimated_calories_kcal || 0;
        s.protein_g += n.protein_g || 0;
        s.carbs_g += n.carbs_g || 0;
        s.fat_g += n.fat_g || 0;
        s.saturated_fat_g += n.saturated_fat_g || 0;
        s.fiber_g += n.dietary_fiber_g || 0;
        s.sodium_mg += n.sodium_mg || 0;
      });
      ['kcal', 'protein_g', 'carbs_g', 'fat_g', 'saturated_fat_g', 'fiber_g', 'sodium_mg'].forEach(function (k) {
        s[k] = Math.round(s[k] * 10) / 10;
      });
      return s;
    }

    var ALERTS = [
      { key: 'glycemic_tg_alert', title: '血糖 / 三酸甘油酯' },
      { key: 'ldl_saturated_fat_alert', title: 'LDL / 飽和脂肪' },
      { key: 'renal_hydration_alert', title: '腎臟 / 水分鈉量' },
      { key: 'sglt2_ketone_safety_alert', title: 'SGLT-2 酮酸安全' }
    ];
    var LEVEL_STYLE = {
      green: 'bg-emerald-50 border-emerald-300 text-emerald-900',
      yellow: 'bg-amber-50 border-amber-300 text-amber-900',
      red: 'bg-rose-50 border-rose-300 text-rose-900'
    };
    var DOT_STYLE = { green: 'bg-emerald-500', yellow: 'bg-amber-400', red: 'bg-rose-500' };
    var LEVEL_TEXT = { green: '綠燈', yellow: '黃燈', red: '紅燈' };

    function clone(o) { return JSON.parse(JSON.stringify(o)); }

    /* =====================================================================
     * 4. COMPONENT: DailyTracker
     * ===================================================================== */
    var DailyTracker = {
      props: { day: { type: Object, required: true } },
      emits: ['update', 'open-settings'],
      setup: function (props, ctx) {
        function commit(mutator) {
          var next = clone(props.day);
          mutator(next);
          ctx.emit('update', next);
        }

        // hydration
        // Targets are user-configurable (Settings): always read them reactively from `live`.
        var targets = computed(function () { return live.targets; });
        var hydrationPct = computed(function () {
          return Math.min(100, Math.round(((props.day.hydration_cc || 0) / (targets.value.hydrationMax || 1)) * 100));
        });
        var hydrationMinPct = computed(function () { return (targets.value.hydrationMin / (targets.value.hydrationMax || 1)) * 100; });
        var hydrationReached = computed(function () { return (props.day.hydration_cc || 0) >= targets.value.hydrationMin; });
        function addWater(cc) { commit(function (d) { d.hydration_cc = Math.max(0, (d.hydration_cc || 0) + cc); }); }

        // meds
        // Medication list is user-editable (Settings); checked state is stored as day.meds[slot][med.id].
        function toggleMed(slot, id) {
          commit(function (d) {
            d.meds = d.meds || {};
            d.meds[slot] = d.meds[slot] || {};
            d.meds[slot][id] = !d.meds[slot][id];
          });
        }
        function isMedTaken(slot, id) { return !!(props.day.meds && props.day.meds[slot] && props.day.meds[slot][id]); }
        var medDone = computed(function () {
          var done = 0, total = 0;
          ['morning', 'evening'].forEach(function (slot) {
            medsForSlot(slot).forEach(function (m) {
              total++;
              if (isMedTaken(slot, m.id)) done++;
            });
          });
          return { done: done, total: total };
        });

        // exercise
        function addExercise(min) { commit(function (d) { d.exercise_min = (d.exercise_min || 0) + min; }); }
        function resetExercise() { commit(function (d) { d.exercise_min = 0; }); }
        var exerciseReached = computed(function () { return (props.day.exercise_min || 0) >= targets.value.exerciseTarget; });

        // meal input
        var mealText = ref('');
        var selectedTags = ref([]);
        var photo = ref(null);
        var busy = ref(false);
        var elapsed = ref(0);
        var error = ref('');
        var latestId = ref(null);
        var elapsedTimer = null;
        var showToast = inject('showToast', function () {});
        function startBusy() {
          busy.value = true; elapsed.value = 0;

          elapsedTimer = setInterval(function () { elapsed.value += 1; }, 1000);
        }
        function stopBusy() { busy.value = false; clearInterval(elapsedTimer); elapsedTimer = null; }

        function applyPreset(p) { mealText.value = p.description; }
        function toggleTag(t) {
          var i = selectedTags.value.indexOf(t);
          if (i >= 0) selectedTags.value.splice(i, 1); else selectedTags.value.push(t);
        }

        // ---- preset / tag manager (customizations persist through updateCustom) ----
        var editMode = ref(false);
        var manageError = ref('');
        var newPreset = reactive({ category: '', label: '', description: '' });
        var newTag = ref('');
        var presetCategories = computed(function () {
          var seen = {}, out = [];
          live.presets.forEach(function (p) { if (!seen[p.category]) { seen[p.category] = true; out.push(p.category); } });
          return out;
        });

        function onPresetEdit(id, field, e) {
          manageError.value = '';
          var list = deepCopy(live.presets);
          var p = list.find(function (x) { return x.id === id; });
          if (!p) return;
          var value = e.target.value.trim();
          if (field === 'label' && !value) { manageError.value = '按鈕名稱不可空白。'; e.target.value = p.label; return; }
          if (field === 'category' && !value) value = '自訂';
          p[field] = value;
          updateCustom('presets', list);
        }
        function deletePreset(id) {
          manageError.value = '';
          updateCustom('presets', live.presets.filter(function (p) { return p.id !== id; }));
        }
        function addPreset() {
          manageError.value = '';
          var label = newPreset.label.trim(), description = newPreset.description.trim();
          if (!label || !description) { manageError.value = '請填寫按鈕名稱與完整餐點描述。'; return; }
          var list = deepCopy(live.presets);
          list.push({ id: 'custom-' + Date.now(), category: newPreset.category.trim() || '自訂', label: label, description: description });
          updateCustom('presets', list);
          newPreset.category = ''; newPreset.label = ''; newPreset.description = '';
        }
        function deleteTag(t) {
          updateCustom('tags', live.tags.filter(function (x) { return x !== t; }));

        }
        function addTag() {
          manageError.value = '';

          newTag.value = '';
        }
        function resetMenu() {
          if (!window.confirm('確定要恢復預設菜單？\n自訂的快選按鈕與修飾標籤都會被移除。')) return;
          resetCustom(['presets', 'tags']);
          selectedTags.value = [];
          manageError.value = '';
        }
        // Save the current textarea content as a new one-click preset.
        function saveAsPreset() {
          error.value = '';

          if (!text) { error.value = '請先在下方輸入餐點描述，再存為常吃快選。'; return; }
          var label = window.prompt('快選按鈕名稱 (簡短)', text.slice(0, 8));

          var cats = presetCategories.value;

          if (category === null) return;

          list.push({ id: 'custom-' + Date.now(), category: category.trim() || '自訂', label: label.trim(), description: text });
          updateCustom('presets', list);
        }

        function onPhoto(e) {
          var file = e.target.files && e.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            var img = new Image();
            img.onload = function () {
              var max = 1024;
              var scale = Math.min(1, max / Math.max(img.width, img.height));
              var canvas = document.createElement('canvas');
              canvas.width = Math.round(img.width * scale);
              canvas.height = Math.round(img.height * scale);
              canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
              var dataUrl = canvas.toDataURL('image/jpeg', 0.8);
              photo.value = { mimeType: 'image/jpeg', data: dataUrl.split(',')[1], preview: dataUrl };
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        }

        function nowTime() { return new Date().toTimeString().slice(0, 5); }

        async function submitMeal(withAI) {
          error.value = '';

            return;
          }
          var id = String(Date.now());

          if (withAI) {

            startBusy();

        }

        function removeMeal(id) {
          commit(function (d) { d.meals = d.meals.filter(function (m) { return m.id !== id; }); d.ai_summary = null; });

        var mealToShow = computed(function () {
          var meals = props.day.meals || [];
          var found = meals.find(function (m) { return m.id === latestId.value; });

        });

        // daily AI summary
        var summaryBusy = ref(false);
        var summaryError = ref('');
        async function runDaySummary() {

            var result = await summarizeDayAI({
              apiKey: apiKey,
              totals: summarizeDay(props.day),
              meals: props.day.meals.map(function (m) {

            });

          } catch (err) {
            summaryError.value = err.message || String(err);

          }

        var totals = computed(function () { return summarizeDay(props.day); });
        var presetGroups = computed(function () {

        });

        return {
          TARGETS: targets, live: live, medsForSlot: medsForSlot, medLabel: medLabel, isMedTaken: isMedTaken, ALERTS: ALERTS,
          editMode: editMode, manageError: manageError, newPreset: newPreset, newTag: newTag, presetCategories: presetCategories,

          resetMenu: resetMenu, saveAsPreset: saveAsPreset,

            for (k in importedDays) { if (importedDays[k] && importedDays[k].date) { await saveDay(importedDays[k]); n++; } }

          } catch (err) {

          }
        }
